<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Простой конвертер IDB ↔ MES для Берёзовской ГРЭС" />
    <title>IDB ↔ MES · Берёзовская ГРЭС</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=auto-convert-20260923-r2" />
  </head>
  <body>
    <main class="simple-shell">
      <header class="simple-header">
        <h1>IDB ↔ MES</h1>
        <p>Берёзовская ГРЭС</p>
      </header>

      <section class="simple-drop" id="drop-zone" tabindex="0" role="button" aria-controls="file-input" aria-label="Бросить IDB или MES для конвертации">
        <span class="simple-drop-icon" aria-hidden="true">↕</span>
        <h2>Брось файл — второй формат скачается сам</h2>
        <p>IDB → MES · MES → IDB</p>
        <button class="simple-pick" id="pick-files" type="button">Выбрать файл</button>
        <input id="file-input" type="file" accept=".idb,.IDB,.mes,.MES,.idbmeta,.IDBMETA" multiple hidden />
      </section>

      <p class="simple-privacy">Файл обрабатывается в браузере и не отправляется на сервер.</p>

      <section class="simple-status" id="status-box" aria-live="polite" role="status">
        <strong id="status-text">Готов к работе</strong>
        <span id="status-detail">Перетащи сюда IDB или MES.</span>
      </section>

      <section class="simple-result" id="result-panel" hidden>
        <a id="output-link" hidden></a>
        <details id="sidecar-details" hidden>
          <summary>Дополнительно</summary>
          <p>Этот файл нужен только для максимально точного восстановления исходного IDB.</p>
          <a id="sidecar-link"></a>
        </details>
      </section>
    </main>
    <script type="module" src="assets/app.min.js?v=auto-convert-20260923-r2"></script>
  </body>
</html>
